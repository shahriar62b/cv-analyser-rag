[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-analyser"
version = "0.1.0"
description = "RAG-based CV vs job description analyser that runs on free, local models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pdfplumber>=0.11",
    "pydantic>=2.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.17", "mypy>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not slow and not ollama'"
markers = [
    "slow: tests that load the real embedding model (run with: pytest -m slow)",
    "ollama: tests that call a running local Ollama server (run with: pytest -m ollama)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, undefined names), I: import order,
# B: likely bugs (bugbear), UP: modern syntax, SIM: simpler code, RUF: ruff's own checks.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# Curly quotes and dashes are deliberate: the code cleans them out of CV text.
allowed-confusables = ["‘", "’", "–"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "docx.*", "sentence_transformers.*"]
ignore_missing_imports = true
